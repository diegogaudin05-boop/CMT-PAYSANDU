<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMT Paysandú</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --border: #334155;
      --whatsapp: #25d366;
      --whatsapp-hover: #1da851;
      --phone: #3b82f6;
      --phone-hover: #1d4ed8;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      background: #0284c7;
      font-size: 0.8rem;
      padding: 4px 8px;
      border-radius: 4px;
    }

    /* KPIs */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .kpi-card {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .kpi-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .kpi-value {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent);
    }

    /* Filtros */
    .controls {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .search-input {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px 15px;
      border-radius: 6px;
      flex: 1;
      min-width: 250px;
    }

    .btn-sync {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .btn-sync:hover {
      background: var(--accent-hover);
      color: #fff;
    }

    /* Tabla */
    .table-container {
      background: var(--card-bg);
      border-radius: 8px;
      border: 1px solid var(--border);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    th, td {
      padding: 12px 15px;
      border-bottom: 1px solid var(--border);
    }

    th {
      background: rgba(0, 0, 0, 0.2);
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
    }

    tr:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    /* Botones de acción */
    .action-btns {
      display: flex;
      gap: 8px;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      color: #fff;
      text-decoration: none;
      transition: transform 0.2s, background-color 0.2s;
    }

    .btn-action:hover {
      transform: scale(1.1);
    }

    .btn-ws {
      background-color: var(--whatsapp);
    }
    .btn-ws:hover {
      background-color: var(--whatsapp-hover);
    }

    .btn-call {
      background-color: var(--phone);
    }
    .btn-call:hover {
      background-color: var(--phone-hover);
    }

    .loading-msg, .error-msg {
      padding: 20px;
      text-align: center;
      color: var(--text-muted);
    }

    .error-msg {
      color: #f87171;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>CMT Paysandú <span class="badge">ANTEL</span></h1>
    <button class="btn-sync" onclick="cargarDatos()">
      <i class="fa-solid fa-rotate"></i> Actualizar Datos
    </button>
  </header>

  <!-- KPIs -->
  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-title">Total Servicios</div>
      <div class="kpi-value" id="kpi-total">-</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">Nodos / Infra</div>
      <div class="kpi-value" id="kpi-nodos">-</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">Último Sync</div>
      <div class="kpi-value" id="kpi-sync" style="font-size: 1rem;">-</div>
    </div>
  </div>

  <!-- Controles -->
  <div class="controls">
    <input type="text" id="inputCliente" class="search-input" placeholder="🔍 Buscar CLIENTE..." oninput="filtrarDatos()">
    <input type="text" id="inputGeneral" class="search-input" placeholder="🔍 Buscar Cliente, Infra, Radio..." oninput="filtrarDatos()">
  </div>

  <!-- Tabla -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Cliente</th>
          <th>Servicio</th>
          <th>Infra</th>
          <th>Radio</th>
          <th>Puerto AGG</th>
          <th>VLAN</th>
          <th>BPL</th>
          <th>Fecha</th>
          <th>Ubicación</th>
          <th>Contacto</th>
        </tr>
      </thead>
      <tbody id="tabla-body">
        <tr>
          <td colspan="10" class="loading-msg">Cargando registros...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzx-s_t_P17feyyQ0p5dc7C5ijX_Y8uZA10aQK9Ilubxg3_47-klHMvssHhctxBSB3B/exec";

  let datosGlobales = [];

  function cargarDatos() {
    const tbody = document.getElementById('tabla-body');
    tbody.innerHTML = '<tr><td colspan="10" class="loading-msg">Cargando registros...</td></tr>';

    const scriptAnterior = document.getElementById('jsonp_script');
    if (scriptAnterior) scriptAnterior.remove();

    const script = document.createElement('script');
    script.id = 'jsonp_script';
    script.src = `${SCRIPT_URL}?callback=recibirDatosNoc&t=${Date.now()}`;
    script.onerror = () => {
      tbody.innerHTML = '<tr><td colspan="10" class="error-msg">Error al cargar datos. Verifique la conexión.</td></tr>';
    };
    document.body.appendChild(script);
  }

  function recibirDatosNoc(data) {
    datosGlobales = data;
    actualizarKPIs();
    renderizarTabla(datosGlobales);
    
    const horaActual = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    document.getElementById('kpi-sync').textContent = horaActual;
  }

  function renderizarTabla(lista) {
    const tbody = document.getElementById('tabla-body');
    if (!lista || lista.length === 0) {
      tbody.innerHTML = '<tr><td colspan="10" style="text-align:center; padding: 20px;">No se encontraron registros.</td></tr>';
      return;
    }

    tbody.innerHTML = lista.map(row => {
      const cliente = row.CLIENTE || row.Cliente || '-';
      const servicio = row.SERVICIO || row.Servicio || '-';
      const infra = row.INFRA || row.Infra || '-';
      const radio = row.RADIO || row.Radio || '-';
      const puerto = row["PUERTO AGG"] || row.PUERTO || '-';
      const vlan = row.VLAN || row.Vlan || '-';
      const bpl = row.BPL || row.Bpl || '-';
      const fecha = row.FECHA || row.Fecha || '-';
      const ubicacion = row["UBICACIÓN"] || row.UBICACION || row.Ubicacion || '-';
      const contactoRaw = row.CONTACTO || row.Contacto || '';

      let contactoHtml = '-';
      if (contactoRaw) {
        let numLimpio = String(contactoRaw).replace(/\D/g, '');
        if (numLimpio.startsWith('09')) {
          numLimpio = '598' + numLimpio.substring(1);
        } else if (numLimpio.length === 8 && numLimpio.startsWith('9')) {
          numLimpio = '598' + numLimpio;
        }

        contactoHtml = `
          <div class="action-btns">
            <span>${contactoRaw}</span>
            <a href="https://wa.me/${numLimpio}" target="_blank" class="btn-action btn-ws" title="WhatsApp">
              <i class="fa-brands fa-whatsapp"></i>
            </a>
            <a href="tel:${numLimpio}" class="btn-action btn-call" title="Llamar">
              <i class="fa-solid fa-phone"></i>
            </a>
          </div>
        `;
      }

      return `
        <tr>
          <td><strong>${cliente}</strong></td>
          <td>${servicio}</td>
          <td>${infra}</td>
          <td>${radio}</td>
          <td>${puerto}</td>
          <td>${vlan}</td>
          <td>${bpl}</td>
          <td>${fecha}</td>
          <td>${ubicacion}</td>
          <td>${contactoHtml}</td>
        </tr>
      `;
    }).join('');
  }

  function actualizarKPIs() {
    document.getElementById('kpi-total').textContent = datosGlobales.length;
    
    const nodosUnicos = new Set(datosGlobales.map(d => d.INFRA || d.Infra).filter(Boolean));
    document.getElementById('kpi-nodos').textContent = nodosUnicos.size;
  }

  function filtrarDatos() {
    const qCliente = document.getElementById('inputCliente').value.toLowerCase();
    const qGeneral = document.getElementById('inputGeneral').value.toLowerCase();

    const filtrados = datosGlobales.filter(row => {
      const cliente = String(row.CLIENTE || row.Cliente || '').toLowerCase();
      const todoElTexto = JSON.stringify(row).toLowerCase();

      const cumpleCliente = !qCliente || cliente.includes(qCliente);
      const cumpleGeneral = !qGeneral || todoElTexto.includes(qGeneral);

      return cumpleCliente && cumpleGeneral;
    });

    renderizarTabla(filtrados);
  }

  // Cargar datos al iniciar
  window.onload = cargarDatos;
</script>

</body>
</html>
